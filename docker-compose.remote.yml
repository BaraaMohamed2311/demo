
services:

  # --- Metrics Service ---
  prometheus:
    image: prom/prometheus
    volumes:
      - "./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml"
      - "./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml" # etc/prometheus/ same location defined in prometheus.yml for alerts
    networks:
      - monitoring
    ports:
      - 9090:9090

  alertmanager:
    image: prom/alertmanager:v0.23.0
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - "./monitoring/alertmanager/raw:/config"
    command: --config.file=/config/alertmanager.yml --log.level=debug
    networks:
      - monitoring

  # --- Node.js API Service ---
  api:
    image: baraamohamed/demo:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: minimal-node-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LOG_LEVEL=info
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-mydb}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # --- PostgreSQL Database Service ---
  db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}

    volumes:
      - pgdata:/var/lib/postgresql/data # Persistent storage volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mydb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  pgdata:
    driver: local

  alertmanager-data:

networks:
  app-network:
    driver: bridge
  monitoring:
    driver: bridge